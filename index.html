
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Knowledge Knight - Learn. Practise. Grow.">
  <title>Knowledge Knight | Learn. Practise. Grow.</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f8ff;
      color: #172554;
    }

    header {
      background: white;
      padding: 22px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5eaf5;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #155eef;
    }

    .tagline {
      color: #64748b;
      font-size: 13px;
      margin-top: 4px;
    }

    .hero {
      text-align: center;
      padding: 65px 20px 35px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 14px;
    }

    .hero h1 span {
      color: #2563eb;
    }

    .hero p {
      color: #64748b;
      font-size: 17px;
      line-height: 1.6;
    }

    .classes {
      max-width: 1050px;
      margin: 20px auto 70px;
      padding: 0 20px;
    }

    .section-title {
      text-align: center;
      font-size: 25px;
      margin-bottom: 25px;
    }

    .class-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 18px;
    }

    .class-btn {
      background: white;
      border: 1px solid #dbe5f5;
      border-radius: 14px;
      padding: 25px 15px;
      font-size: 18px;
      font-weight: bold;
      color: #1e40af;
      cursor: pointer;
      transition: 0.2s;
    }

    .class-btn:hover,
    .class-btn.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
      transform: translateY(-3px);
    }

    .resource-panel {
      display: none;
      background: white;
      border: 1px solid #dbe5f5;
      border-radius: 18px;
      padding: 30px;
      margin-top: 30px;
      box-shadow: 0 8px 25px rgba(30, 64, 175, 0.06);
    }

    .resource-panel.show {
      display: block;
    }

    .resource-panel h2 {
      margin-bottom: 8px;
      font-size: 25px;
    }

    .resource-panel > p {
      color: #64748b;
      margin-bottom: 23px;
    }

    .resource-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .resource-card {
      display: block;
      text-decoration: none;
      background: #f5f8ff;
      border: 1px solid #e0e9fb;
      border-radius: 13px;
      padding: 23px;
      color: #1e40af;
      transition: 0.2s;
    }

    .resource-card:hover {
      background: #eaf1ff;
      border-color: #2563eb;
      transform: translateY(-3px);
    }

    .resource-card h3 {
      margin-bottom: 8px;
      font-size: 19px;
    }

    .resource-card p {
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }

    footer {
      background: white;
      border-top: 1px solid #e5eaf5;
      text-align: center;
      padding: 25px 15px;
      color: #64748b;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 32px;
      }

      header {
        padding: 18px 5%;
      }

      .resource-panel {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div>
      <div class="logo">⚔️ Knowledge Knight</div>
      <div class="tagline">Learn. Practise. Grow.</div>
    </div>
  </header>

  <section class="hero">
    <h1>Welcome to <span>Knowledge Knight</span></h1>
    <p>Your learning journey starts here.<br>
       Choose your class to explore your study resources.</p>
  </section>

  <main class="classes">
    <h2 class="section-title">Choose Your Class</h2>

    <div class="class-grid">
      <button class="class-btn" data-class="5">Class 5</button>
      <button class="class-btn" data-class="6">Class 6</button>
      <button class="class-btn" data-class="7">Class 7</button>
      <button class="class-btn" data-class="8">Class 8</button>
      <button class="class-btn" data-class="9">Class 9</button>
      <button class="class-btn" data-class="10">Class 10</button>
      <button class="class-btn" data-class="11">Class 11</button>
      <button class="class-btn" data-class="12">Class 12</button>
    </div>

    <section class="resource-panel" id="resourcePanel">
      <h2 id="selectedClass">Class 5</h2>
      <p>Choose the resource you want to explore.</p>

      <div class="resource-grid" id="resourceGrid">
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 Knowledge Knight. All rights reserved.</p>
    <p style="margin-top: 7px;">Learn. Practise. Grow.</p>
  </footer>

  <script>
    const classButtons = document.querySelectorAll(".class-btn");
    const resourcePanel = document.getElementById("resourcePanel");
    const selectedClass = document.getElementById("selectedClass");
    const resourceGrid = document.getElementById("resourceGrid");

    const resources = [
      {
        name: "Notes",
        description: "Understand topics with study notes.",
        folder: "notes"
      },
      {
        name: "Flashcards",
        description: "Revise important concepts and facts.",
        folder: "flashcards"
      },
      {
        name: "Quizzes",
        description: "Test your knowledge with quizzes.",
        folder: "quizzes"
      }
    ];

    classButtons.forEach(button => {
      button.addEventListener("click", () => {
        const classNumber = button.dataset.class;

        classButtons.forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");

        selectedClass.textContent = `Class ${classNumber}`;

        resourceGrid.innerHTML = resources.map(resource => `
          <a class="resource-card"
             href="class${classNumber}-${resource.folder}/">
            <h3>${resource.name} →</h3>
            <p>${resource.description}</p>
          </a>
        `).join("");

        resourcePanel.classList.add("show");
        resourcePanel.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });
      });
    });
  </script>

</body>
</html>
